<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="ResQMeal is a smart food donation and rescue platform that connects restaurants, NGOs, and volunteers to reduce food waste and help feed people in need."
    />

    <meta
      name="keywords"
      content="ResQMeal, food donation, food waste management, NGO platform, surplus food, hunger solution, food rescue app, MERN project, donate food, community support"
    />

    <meta name="author" content="Asad Ali" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#16a34a" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Title -->
    <title>
      ResQMeal – Food Waste Reduction and Redistribution Platform
    </title>

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="ResQMeal | Food Donation & Waste Management Platform"
    />

    <meta
      property="og:description"
      content="Join ResQMeal to reduce food waste by connecting restaurants, NGOs, and volunteers for food donation and distribution."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://resqmeal.netlify.app/"
    />

    <meta
      property="og:image"
      content="https://resqmeal.netlify.app/logo.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="ResQMeal | Food Donation & Waste Management Platform"
    />

    <meta
      name="twitter:description"
      content="A platform to rescue surplus food, reduce food waste, and help communities in need."
    />

    <meta
      name="twitter:image"
      content="https://resqmeal.netlify.app/logo.png"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://resqmeal.netlify.app/"
    />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ResQMeal",
        "url": "https://resqmeal.netlify.app/",
        "description": "ResQMeal is a food donation and waste management platform connecting restaurants, NGOs, and volunteers.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://resqmeal.netlify.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
